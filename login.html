<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin - XI TEI A</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <div class="login-box">

            <h1>LOGIN ADMIN</h1>

            <input
                type="email"
                id="email"
                placeholder="Email"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <button id="loginButton">
                Login
            </button>

            <p id="loginStatus"></p>

        </div>

    </main>


    <script
        type="module"
        src="js/login.js">
    </script>

</body>

</html>
